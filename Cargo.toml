[package]
name = "dprint-plugin-json"
version = "0.23.0"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2024"
homepage = "https://github.com/dprint/dprint-plugin-json"
keywords = ["formatting", "formatter", "json", "jsonc"]
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-json"
description = "JSON formatter for dprint."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]
# The AST/IR generator (used only for trace output) is the only thing that
# still needs these; the normal formatter works straight off the bytes.
tracing = ["dprint-core/tracing", "dep:text_lines", "dep:dprint-core-macros"]

[dependencies]
dprint-core = { version = "0.69.1", features = ["formatting"] }
dprint-core-macros = { version = "0.1.0", optional = true }
# used by the package.json conventions (cst) and the tracing generator
jsonc-parser = { version = "0.33.2", features = ["cst", "error_unicode_width"] }
serde = { version = "1.0.144", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
text_lines = { version = "0.6.0", optional = true }
thiserror = "2"
unicode-width = "0.2.0"

[dev-dependencies]
anyhow = "1.0.64"
debug-here = "0.2"
dprint-development = "0.10.2"
serde_json = { version = "1.0" }
